<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="em-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="50%" stop-color="#14172b" />
      <stop offset="100%" stop-color="#080910" />
    </linearGradient>
    <linearGradient id="em-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#em-bg)" />

  <!-- Subtle E-commerce nodes -->
  <g opacity="0.04" stroke="#6366f1" stroke-width="1.5">
    <circle cx="200" cy="200" r="100" fill="none" />
    <circle cx="1400" cy="700" r="120" fill="none" />
    <line x1="0" y1="450" x2="1600" y2="450" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect width="1440" height="70" rx="14" fill="#14182e" stroke="#282f5c" stroke-width="1.5" />
    <circle cx="45" cy="35" r="18" fill="url(#em-indigo)" />
    <text x="36" y="42" font-family="'Cairo', sans-serif" font-weight="900" font-size="16" fill="#ffffff">م</text>
    <text x="75" y="38" font-family="'Cairo', sans-serif" font-weight="900" font-size="20" fill="#ffffff">المتاجر • El Matajer SaaS Multi-Vendor Platform</text>
    <text x="75" y="55" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#a5b4fc" letter-spacing="1">REGIONAL MULTI-TENANT E-COMMERCE INFRASTRUCTURE FOR THE MIDDLE EAST</text>
    <text x="1000" y="42" font-family="'Cairo', sans-serif" font-weight="600" font-size="15" fill="#cbd5e1">لوحة التاجر • بوابات الدفع • الربط مع شركات الشحن</text>
    <rect x="1300" y="18" width="115" height="34" rx="8" fill="url(#em-indigo)" />
    <text x="1328" y="40" font-family="'Cairo', sans-serif" font-weight="800" font-size="13" fill="#ffffff">لوحة التاجر</text>
  </g>

  <!-- Left Column: Merchant Multi-Store Dashboard & Sales Engine -->
  <g transform="translate(80, 160)">
    <rect width="900" height="680" rx="20" fill="#111429" stroke="#222852" stroke-width="1.5" />
    
    <g transform="translate(45, 45)">
      <rect width="250" height="32" rx="16" fill="#1b2045" stroke="#6366f1" stroke-width="1" />
      <text x="25" y="21" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#a5b4fc">MERCHANT DASHBOARD (MULTI-TENANT)</text>
      
      <text x="0" y="85" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#ffffff">إدارة متجرك ومبيعاتك وشحناتك من مكان واحد</text>
      <text x="0" y="120" font-family="'Cairo', sans-serif" font-weight="600" font-size="16" fill="#a5b4fc">منصة سحابية متكاملة لرواد الأعمال تتيح إطلاق متجر احترافي خلال دقائق</text>
    </g>

    <!-- Merchant Revenue Metrics Grid -->
    <g transform="translate(45, 180)">
      <rect width="250" height="130" rx="14" fill="#171b38" stroke="#2d356e" stroke-width="1" />
      <text x="25" y="40" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#9ca3af">إجمالي المبيعات (هذا الشهر):</text>
      <text x="25" y="85" font-family="'Inter', sans-serif" font-weight="900" font-size="32" fill="#ffffff">$48,920</text>
      <text x="180" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#22c55e">+24.5%</text>

      <g transform="translate(280, 0)">
        <rect width="250" height="130" rx="14" fill="#171b38" stroke="#2d356e" stroke-width="1" />
        <text x="25" y="40" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#9ca3af">الطلبات المكتملة:</text>
        <text x="25" y="85" font-family="'Inter', sans-serif" font-weight="900" font-size="32" fill="#ffffff">1,480</text>
        <text x="160" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#22c55e">نسبة التسليم 99%</text>
      </g>

      <g transform="translate(560, 0)">
        <rect width="250" height="130" rx="14" fill="#171b38" stroke="#2d356e" stroke-width="1" />
        <text x="25" y="40" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#9ca3af">متوسط قيمة السلة:</text>
        <text x="25" y="85" font-family="'Inter', sans-serif" font-weight="900" font-size="32" fill="#ffffff">$33.05</text>
        <text x="175" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#a5b4fc">AOV النمو</text>
      </g>
    </g>

    <!-- Shipping Courier & Payment Gateway Integrations Bar -->
    <g transform="translate(45, 340)">
      <rect width="810" height="280" rx="14" fill="#141833" stroke="#6366f1" stroke-width="1" />
      <text x="35" y="40" font-family="'Inter', sans-serif" font-weight="800" font-size="17" fill="#a5b4fc">PRE-BUILT REGIONAL SHIPPING &amp; PAYMENT INTEGRATIONS</text>
      
      <text x="35" y="80" font-family="'Cairo', sans-serif" font-weight="700" font-size="19" fill="#ffffff">ربط فوري جاهز بدون تعقيدات برمجية مع:</text>
      
      <!-- Courier & Payment Pills -->
      <g transform="translate(35, 110)">
        <rect width="170" height="50" rx="10" fill="#1f254f" stroke="#353e82" stroke-width="1" />
        <text x="20" y="32" font-family="'Cairo', sans-serif" font-weight="800" font-size="14" fill="#ffffff">📦 أرامكس (Aramex)</text>

        <rect x="185" width="170" height="50" rx="10" fill="#1f254f" stroke="#353e82" stroke-width="1" />
        <text x="20" y="32" font-family="'Cairo', sans-serif" font-weight="800" font-size="14" fill="#ffffff">🚚 بوسطة (Bosta)</text>

        <rect x="370" width="170" height="50" rx="10" fill="#1f254f" stroke="#353e82" stroke-width="1" />
        <text x="20" y="32" font-family="'Cairo', sans-serif" font-weight="800" font-size="14" fill="#ffffff">💳 ميسر وباي موب</text>

        <rect x="555" width="180" height="50" rx="10" fill="#1f254f" stroke="#353e82" stroke-width="1" />
        <text x="20" y="32" font-family="'Cairo', sans-serif" font-weight="800" font-size="14" fill="#ffffff">🍎 أبل باي ومدى</text>
      </g>

      <text x="35" y="210" font-family="'Cairo', sans-serif" font-weight="500" font-size="15" fill="#cbd5e1">تتيح المنصة طباعة بوالص الشحن التلقائية مع الباركود وتتبع مسار الشحنة حتى تسليمها للعميل مع تحصيل أموال الدفع عند الاستلام ونقلها لحسابك البنكي.</text>
    </g>
  </g>

  <!-- Right Column: Store Customizer & Instant Checkout -->
  <g transform="translate(1020, 160)">
    <rect width="500" height="680" rx="20" fill="#111429" stroke="#222852" stroke-width="1.5" />
    
    <g transform="translate(45, 45)">
      <text x="0" y="30" font-family="'Cairo', sans-serif" font-weight="900" font-size="22" fill="#ffffff">محرر المتاجر وقوالب الهوية</text>
      <text x="0" y="60" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#a5b4fc">صفحات هبوط فائقة السرعة تزيد التحويل</text>

      <!-- Store Preview Card -->
      <g transform="translate(0, 90)">
        <rect width="410" height="200" rx="14" fill="#171b38" stroke="#2d356e" stroke-width="1" />
        <rect x="20" y="20" width="370" height="110" rx="10" fill="#0f1124" />
        <circle cx="70" cy="75" r="25" fill="url(#em-indigo)" />
        <text x="110" y="65" font-family="'Cairo', sans-serif" font-weight="800" font-size="16" fill="#ffffff">متجر أزياء الشرق الفاخر</text>
        <text x="110" y="90" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#22c55e">ONLINE • SUB-SECOND CHECKOUT (0.6s)</text>
        <text x="25" y="165" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">دعم العملات المحلية (جنيه، ريال، درهم، دولار) مع واجهة عربية 100%.</text>
      </g>

      <!-- Merchant Advantages Box -->
      <g transform="translate(0, 310)">
        <rect width="410" height="260" rx="14" fill="#151936" stroke="#6366f1" stroke-width="1.5" />
        <text x="25" y="40" font-family="'Cairo', sans-serif" font-weight="800" font-size="16" fill="#ffffff">لماذا يفضل التجار منصة المتاجر؟</text>
        <text x="25" y="80" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#c7d2fe">✓ استضافة سحابية فائقة السرعة تتحمل ملايين الزيارات</text>
        <text x="25" y="120" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#c7d2fe">✓ نطاق خاص مجاني باسم متجرك (yourstore.com)</text>
        <text x="25" y="160" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#c7d2fe">✓ أدوات تسويق مدمجة وكوبونات خصم وتتبع بكسل الإعلانات</text>
        <text x="25" y="200" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#c7d2fe">✓ حماية ضد الاحتيال وضمان استقرار 99.99%</text>
      </g>
    </g>
  </g>
</svg>
