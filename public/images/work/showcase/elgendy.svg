<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="elgendy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f192e" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>
    <linearGradient id="ed-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="ed-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#elgendy-bg)" />

  <!-- Subtle Geometric Study Motif -->
  <g opacity="0.05" stroke="#3b82f6" stroke-width="1.5">
    <circle cx="200" cy="200" r="100" fill="none" />
    <circle cx="1400" cy="700" r="150" fill="none" />
    <line x1="0" y1="450" x2="1600" y2="450" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect width="1440" height="70" rx="14" fill="#111c33" stroke="#233557" stroke-width="1.5" />
    <circle cx="45" cy="35" r="18" fill="url(#ed-blue)" />
    <text x="36" y="42" font-family="'Cairo', sans-serif" font-weight="900" font-size="16" fill="#ffffff">ج</text>
    <text x="75" y="38" font-family="'Cairo', sans-serif" font-weight="900" font-size="20" fill="#ffffff">سنتر الأستاذ محمد الجندي التعليمي</text>
    <text x="75" y="55" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#60a5fa" letter-spacing="1">EL GENDY EDUCATIONAL CENTER • SMART LMS &amp; EXAMINATION ENGINE</text>
    <text x="950" y="42" font-family="'Cairo', sans-serif" font-weight="600" font-size="15" fill="#cbd5e1">محاضرات الأونلاين • الامتحانات الذكية • كروت الشحن • بوابة ولي الأمر</text>
    <rect x="1300" y="18" width="115" height="34" rx="8" fill="url(#ed-blue)" />
    <text x="1325" y="40" font-family="'Cairo', sans-serif" font-weight="800" font-size="13" fill="#ffffff">حساب الطالب</text>
  </g>

  <!-- Left Column: Timed Interactive Online Exam Engine -->
  <g transform="translate(80, 160)">
    <rect width="900" height="680" rx="20" fill="#0d172a" stroke="#1e3256" stroke-width="1.5" />
    
    <g transform="translate(45, 45)">
      <rect width="250" height="32" rx="16" fill="#182c4d" stroke="#3b82f6" stroke-width="1" />
      <text x="25" y="21" font-family="'Cairo', sans-serif" font-weight="700" font-size="12" fill="#60a5fa">منظومة الامتحانات الإلكترونية التفاعلية</text>
      
      <!-- Exam Header -->
      <g transform="translate(0, 45)">
        <text x="0" y="30" font-family="'Cairo', sans-serif" font-weight="900" font-size="28" fill="#ffffff">امتحان شامل: الكيمياء الكهربية وقوانين فاراداي</text>
        <text x="0" y="60" font-family="'Cairo', sans-serif" font-weight="600" font-size="15" fill="#94a3b8">الصف الثالث الثانوي • 40 سؤالاً اختيار من متعدد • مدة الامتحان: 60 دقيقة</text>
        
        <!-- Countdown Timer Card -->
        <rect x="630" y="-10" width="180" height="60" rx="12" fill="#1e1833" stroke="#ef4444" stroke-width="1.5" />
        <text x="650" y="15" font-family="'Cairo', sans-serif" font-weight="700" font-size="11" fill="#f87171">الوقت المتبقي للامتحان:</text>
        <text x="665" y="42" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#ef4444">34 : 18</text>
      </g>
    </g>

    <!-- Question Box Preview -->
    <g transform="translate(45, 180)">
      <rect width="810" height="260" rx="14" fill="#132038" stroke="#253a61" stroke-width="1" />
      <text x="30" y="40" font-family="'Cairo', sans-serif" font-weight="800" font-size="16" fill="#60a5fa">السؤال 14 من 40 (درجتان):</text>
      <text x="30" y="75" font-family="'Cairo', sans-serif" font-weight="700" font-size="17" fill="#ffffff">عند مرور كمية من الكهرباء مقدارها 2 فاراداي في مصهور أكسيد الألومنيوم Al₂O₃، فإن كتلة الألومنيوم المترسبة تساوي:</text>
      
      <!-- Options -->
      <g transform="translate(30, 105)">
        <rect width="360" height="45" rx="8" fill="#1a2b4a" stroke="#2d4573" stroke-width="1" />
        <circle cx="25" cy="22" r="8" fill="none" stroke="#60a5fa" stroke-width="2" />
        <text x="45" y="28" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">أ) 9 جرامات من الألومنيوم</text>

        <!-- Selected Correct Option -->
        <g transform="translate(390, 0)">
          <rect width="360" height="45" rx="8" fill="#193b2a" stroke="#22c55e" stroke-width="1.5" />
          <circle cx="25" cy="22" r="8" fill="#22c55e" />
          <text x="45" y="28" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#ffffff">ب) 18 جراماً (الإجابة النموذجية المحددة)</text>
        </g>

        <g transform="translate(0, 55)">
          <rect width="360" height="45" rx="8" fill="#1a2b4a" stroke="#2d4573" stroke-width="1" />
          <circle cx="25" cy="22" r="8" fill="none" stroke="#60a5fa" stroke-width="2" />
          <text x="45" y="28" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">ج) 27 جراماً</text>
        </g>

        <g transform="translate(390, 55)">
          <rect width="360" height="45" rx="8" fill="#1a2b4a" stroke="#2d4573" stroke-width="1" />
          <circle cx="25" cy="22" r="8" fill="none" stroke="#60a5fa" stroke-width="2" />
          <text x="45" y="28" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">د) 54 جراماً</text>
        </g>
      </g>
    </g>

    <!-- Instant Auto-Grading & Analysis Banner -->
    <g transform="translate(45, 470)">
      <rect width="810" height="160" rx="14" fill="#0f1d35" stroke="#3b82f6" stroke-width="1" />
      <text x="35" y="40" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#3b82f6">AUTOMATED GRADING &amp; DETAILED EXPLANATION VIDEO</text>
      <text x="35" y="75" font-family="'Cairo', sans-serif" font-weight="700" font-size="18" fill="#ffffff">تصحيح فوري وتحليل نقاط الضعف لكل طالب مع إشعار ولي الأمر</text>
      <text x="35" y="110" font-family="'Cairo', sans-serif" font-weight="500" font-size="14" fill="#93c5fd">بمجرد الضغط على إنهاء الامتحان، يظهر التقرير التحليلي فوراً للطالب مع فيديو شرح لكل مسألة أخطأ فيها، وتُرسل النتيجة برسالة SMS لوالده.</text>
    </g>
  </g>

  <!-- Right Column: Student Attendance & Scratch-Card Recharge Portal -->
  <g transform="translate(1020, 160)">
    <rect width="500" height="680" rx="20" fill="#0d172a" stroke="#1e3256" stroke-width="1.5" />
    
    <g transform="translate(45, 45)">
      <text x="0" y="30" font-family="'Cairo', sans-serif" font-weight="800" font-size="24" fill="#ffffff">حساب الطالب وكروت الشحن</text>
      <text x="0" y="60" font-family="'Cairo', sans-serif" font-weight="500" font-size="14" fill="#60a5fa">نظام الدخول الآمن وحضور الحصص بالسنتر</text>

      <!-- Student Card -->
      <g transform="translate(0, 90)">
        <rect width="410" height="120" rx="14" fill="#132038" stroke="#253a61" stroke-width="1" />
        <circle cx="50" cy="60" r="30" fill="url(#ed-blue)" />
        <text x="40" y="68" font-family="'Cairo', sans-serif" font-weight="900" font-size="22" fill="#ffffff">ط</text>
        <text x="95" y="45" font-family="'Cairo', sans-serif" font-weight="800" font-size="18" fill="#ffffff">يوسف أحمد الشناوي</text>
        <text x="95" y="70" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#60a5fa">مجموعة السبت والثلاثاء • سنتر النصر</text>
        <text x="95" y="95" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#22c55e">نسبة الحضور: 100% • ترتيب الدفعة: #4</text>
      </g>

      <!-- Scratch Card Redemption Box -->
      <g transform="translate(0, 230)">
        <rect width="410" height="190" rx="14" fill="#18253f" stroke="#3b82f6" stroke-width="1.5" />
        <text x="25" y="35" font-family="'Cairo', sans-serif" font-weight="800" font-size="17" fill="#ffffff">شحن كود المحاضرة (كارت السنتر)</text>
        <text x="25" y="65" font-family="'Cairo', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">أدخل كود الكارت المطبوع لفتح المحاضرة والواجب:</text>
        
        <rect x="25" y="85" width="360" height="45" rx="8" fill="#0d172a" stroke="#2b4269" stroke-width="1" />
        <text x="45" y="114" font-family="'Courier New', monospace" font-weight="900" font-size="18" fill="#60a5fa">GND-2026-X984-72Q1</text>
        
        <rect x="25" y="140" width="360" height="40" rx="8" fill="url(#ed-blue)" />
        <text x="135" y="165" font-family="'Cairo', sans-serif" font-weight="800" font-size="14" fill="#ffffff">تفعيل الكارت وشحن الرصيد</text>
      </g>

      <!-- Parent Portal Live Stats -->
      <g transform="translate(0, 440)">
        <rect width="410" height="150" rx="12" fill="#0f1b30" stroke="#1d3052" stroke-width="1" />
        <text x="25" y="35" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#ffffff">مزايا تطبيق ولي الأمر المتكامل:</text>
        <text x="25" y="65" font-family="'Cairo', sans-serif" font-weight="500" font-size="13" fill="#60a5fa">✓ إشعار فوري بحضور أو غياب الطالب عبر باركود البوابة</text>
        <text x="25" y="95" font-family="'Cairo', sans-serif" font-weight="500" font-size="13" fill="#60a5fa">✓ تقرير درجات الامتحانات والواجبات أسبوعياً</text>
        <text x="25" y="125" font-family="'Cairo', sans-serif" font-weight="500" font-size="13" fill="#60a5fa">✓ حماية الفيديوهات من التسجيل لمنع القرصنة وسرقة المحتوى</text>
      </g>
    </g>
  </g>
</svg>
