<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- Royal Crown & Watch Dial Motif -->
  <g transform="translate(14, 14)">
    <circle cx="28" cy="28" r="22" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8" />
    <circle cx="28" cy="28" r="18" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 3" opacity="0.5" />
    <!-- Royal Crown -->
    <path d="M18,34 L18,24 L23,28 L28,20 L33,28 L38,24 L38,34 Z" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <!-- Diamond/gem points -->
    <circle cx="18" cy="22" r="1.2" fill="#FFFFFF" />
    <circle cx="28" cy="18" r="1.5" fill="#FFFFFF" />
    <circle cx="38" cy="22" r="1.2" fill="#FFFFFF" />
  </g>
  <!-- Regal Wordmark -->
  <text x="76" y="37" fill="#FFFFFF" font-family="'Cinzel', 'Playfair Display', serif" font-weight="900" font-size="24" letter-spacing="4">REGALEST</text>
  <text x="78" y="53" fill="#FFFFFF" font-family="'Cairo', sans-serif" font-weight="600" font-size="11" letter-spacing="2" opacity="0.75">المتجر الملكي للساعات</text>
</svg>
