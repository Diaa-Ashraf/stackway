<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="regal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a09" />
      <stop offset="50%" stop-color="#14110d" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>
    <linearGradient id="gold-luxury" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="25%" stop-color="#fcf6ba" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="75%" stop-color="#fbf5b7" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#regal-bg)" />

  <!-- Subtle Gold Radial Glow -->
  <circle cx="800" cy="450" r="500" fill="#d4af37" opacity="0.04" />

  <!-- Luxury Header -->
  <g transform="translate(80, 50)">
    <rect width="1440" height="70" rx="14" fill="#14110d" stroke="#2e2518" stroke-width="1.5" />
    <text x="45" y="44" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="26" fill="url(#gold-luxury)" letter-spacing="4">REGALEST</text>
    <text x="260" y="44" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#d4af37" letter-spacing="3">HAUTE HORLOGERIE &amp; ROYAL TIMEPIECES</text>
    <text x="880" y="42" font-family="'Cairo', sans-serif" font-weight="600" font-size="15" fill="#e5e5e5">المجموعات الملكية • الساعات الأوتوماتيكية • الإصدارات المحدودة • الفحص</text>
    <rect x="1310" y="18" width="105" height="34" rx="6" fill="url(#gold-luxury)" />
    <text x="1340" y="41" font-family="'Cairo', sans-serif" font-weight="800" font-size="13" fill="#000000">الحقيبة (1)</text>
  </g>

  <!-- Left Column: 3D Watch Inspection & Interactive Caliber Showcase -->
  <g transform="translate(80, 160)">
    <rect width="900" height="680" rx="20" fill="#120e0a" stroke="#2b2014" stroke-width="1.5" />
    
    <g transform="translate(45, 45)">
      <rect width="200" height="30" rx="15" fill="#241a0d" stroke="#d4af37" stroke-width="1" />
      <text x="20" y="20" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#d4af37" letter-spacing="2">LIMITED EDITION • 1 OF 50</text>
      
      <text x="0" y="85" font-family="'Cinzel', 'Times New Roman', serif" font-weight="800" font-size="36" fill="url(#gold-luxury)">The Sovereign Royal Tourbillon</text>
      <text x="0" y="125" font-family="'Cairo', sans-serif" font-weight="600" font-size="18" fill="#e5e5e5">ساعة ملكية فاخرة بهيكل من الذهب الوردي عيار 18 قيراط وميناء مفتوح معقد</text>
    </g>

    <!-- Watch Visual & Caliber Details -->
    <g transform="translate(45, 180)">
      <!-- Watch Dial Graphic -->
      <g transform="translate(100, 150)">
        <circle cx="150" cy="150" r="140" fill="#18140f" stroke="url(#gold-luxury)" stroke-width="6" />
        <circle cx="150" cy="150" r="115" fill="#0d0a07" stroke="#3d2f1c" stroke-width="2" />
        <circle cx="150" cy="150" r="90" fill="none" stroke="url(#gold-luxury)" stroke-width="1" stroke-dasharray="4 8" />
        <!-- Tourbillon Cage -->
        <circle cx="150" cy="200" r="32" fill="#1a140d" stroke="url(#gold-luxury)" stroke-width="2" />
        <circle cx="150" cy="200" r="10" fill="#d4af37" />
        <!-- Hands -->
        <line x1="150" y1="150" x2="190" y2="105" stroke="url(#gold-luxury)" stroke-width="4" stroke-linecap="round" />
        <line x1="150" y1="150" x2="110" y2="90" stroke="url(#gold-luxury)" stroke-width="3" stroke-linecap="round" />
        <circle cx="150" cy="150" r="7" fill="url(#gold-luxury)" />
      </g>

      <!-- Caliber Specifications Box -->
      <g transform="translate(450, 40)">
        <rect width="360" height="380" rx="14" fill="#19130d" stroke="#3b2b18" stroke-width="1" />
        <text x="30" y="45" font-family="'Cinzel', serif" font-weight="800" font-size="16" fill="url(#gold-luxury)">CALIBER SPECIFICATIONS</text>
        
        <text x="30" y="90" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#9ca3af">آلية الحركة والحجم:</text>
        <text x="30" y="115" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff">Swiss Flying Tourbillon (21,600 vph)</text>

        <text x="30" y="160" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#9ca3af">احتياطي الطاقة:</text>
        <text x="30" y="185" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#d4af37">72 Hours Power Reserve</text>

        <text x="30" y="230" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#9ca3af">معدن الهيكل والزجاج:</text>
        <text x="30" y="255" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff">18k Rose Gold • Double Sapphire Crystal</text>

        <text x="30" y="300" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#9ca3af">مقاومة الماء:</text>
        <text x="30" y="325" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff">50 Meters (5 ATM)</text>
      </g>
    </g>

    <g transform="translate(45, 520)">
      <rect width="810" height="110" rx="12" fill="#1a140d" stroke="#d4af37" stroke-width="1" />
      <text x="30" y="45" font-family="'Cinzel', serif" font-weight="800" font-size="16" fill="url(#gold-luxury)">SWIPER 3D INTERACTIVE CASE ROTATION</text>
      <text x="30" y="80" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#cbd5e1">تقنية عرض تفاعلية 360 درجة تتيح للعميل استكشاف تفاصيل الميناء والنقوش اليدوية بدقة ميكروسكوبية فائقة.</text>
    </g>
  </g>

  <!-- Right Column: Luxury Checkout & Authentication Certificate -->
  <g transform="translate(1020, 160)">
    <rect width="500" height="680" rx="20" fill="#120e0a" stroke="#2b2014" stroke-width="1.5" />
    
    <g transform="translate(45, 45)">
      <text x="0" y="30" font-family="'Cinzel', serif" font-weight="800" font-size="24" fill="url(#gold-luxury)">BOUTIQUE ACQUISITION</text>
      <text x="0" y="60" font-family="'Cairo', sans-serif" font-weight="500" font-size="14" fill="#d4af37">شحن فاخر ومؤمّن بالكامل إلى باب قصرك</text>

      <!-- Price Box -->
      <g transform="translate(0, 90)">
        <rect width="410" height="110" rx="12" fill="#1c150e" stroke="#d4af37" stroke-width="1.5" />
        <text x="25" y="40" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#9ca3af">السعر الرسمي شامل الضريبة:</text>
        <text x="25" y="85" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="url(#gold-luxury)">$18,400 USD</text>
      </g>

      <!-- Royal Packaging & Warranty Box -->
      <g transform="translate(0, 230)">
        <rect width="410" height="240" rx="12" fill="#17110b" stroke="#362615" stroke-width="1" />
        <text x="25" y="35" font-family="'Cairo', sans-serif" font-weight="800" font-size="16" fill="#ffffff">امتيازات الاقتناء الملكي:</text>
        <text x="25" y="70" font-family="'Cairo', sans-serif" font-weight="500" font-size="14" fill="#d4af37">✓ صندوق خشبي فاخر مصنوع يدوياً من خشب الأبنوس</text>
        <text x="25" y="105" font-family="'Cairo', sans-serif" font-weight="500" font-size="14" fill="#d4af37">✓ شهادة أصالة دولية وضمان دولي لمدة 5 سنوات</text>
        <text x="25" y="140" font-family="'Cairo', sans-serif" font-weight="500" font-size="14" fill="#d4af37">✓ شحن طيران خاص مصفّح ومؤمّن 100%</text>
        <text x="25" y="175" font-family="'Cairo', sans-serif" font-weight="500" font-size="14" fill="#d4af37">✓ خدمة كونسيرج ومساعد مبيعات شخصي متاح 24/7</text>
      </g>

      <!-- CTA Button -->
      <g transform="translate(0, 500)">
        <rect width="410" height="55" rx="10" fill="url(#gold-luxury)" />
        <text x="120" y="35" font-family="'Cairo', sans-serif" font-weight="900" font-size="17" fill="#000000">طلب الاقتناء الفوري الآن</text>
      </g>
    </g>
  </g>
</svg>
