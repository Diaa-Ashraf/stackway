<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="safa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12" />
      <stop offset="50%" stop-color="#141724" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="fuel-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="petro-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#safa-bg)" />

  <!-- Industrial Pipeline grid motif -->
  <g opacity="0.04" stroke="#f97316" stroke-width="2">
    <path d="M0,200 L1600,200 M0,500 L1600,500 M0,700 L1600,700" />
    <path d="M300,0 L300,900 M700,0 L700,900 M1100,0 L1100,900 M1400,0 L1400,900" />
  </g>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect width="1440" height="70" rx="14" fill="#131622" stroke="#252b40" stroke-width="1.5" />
    <circle cx="45" cy="35" r="18" fill="url(#fuel-flame)" />
    <path d="M45,23 C40,29 37,34 37,38 C37,43 41,46 45,46 C49,46 53,43 53,38 C53,34 50,29 45,23 Z" fill="#ffffff" />
    <text x="75" y="38" font-family="'Cairo', sans-serif" font-weight="900" font-size="20" fill="#ffffff">شركة الصفا للخدمات البترولية والتوريدات الصناعية</text>
    <text x="75" y="55" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#f97316" letter-spacing="1">AL SAFA PETROLEUM SERVICES &amp; INDUSTRIAL FUEL SUPPLY</text>
    <text x="960" y="42" font-family="'Cairo', sans-serif" font-weight="600" font-size="15" fill="#cbd5e1">توريد السولار الصناعي • أساطيل النقل • عقود الشركات • شهادات الجودة</text>
    <rect x="1290" y="18" width="125" height="34" rx="6" fill="url(#fuel-flame)" />
    <text x="1312" y="40" font-family="'Cairo', sans-serif" font-weight="800" font-size="13" fill="#ffffff">طلب توريد وقود</text>
  </g>

  <!-- Left Column: Industrial Operations & Fleet Dispatch Gateway -->
  <g transform="translate(80, 160)">
    <rect width="900" height="680" rx="20" fill="#111420" stroke="#22283a" stroke-width="1.5" />
    
    <g transform="translate(45, 45)">
      <rect width="280" height="32" rx="16" fill="#241812" stroke="#f97316" stroke-width="1" />
      <text x="25" y="21" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#f97316">ISO 9001 / ISO 14001 / ISO 45001 CERTIFIED</text>
      
      <text x="0" y="85" font-family="'Cairo', sans-serif" font-weight="900" font-size="36" fill="#ffffff">توريد وقود الديزل والسولار لكبرى المصانع والمشروعات</text>
      <text x="0" y="125" font-family="'Cairo', sans-serif" font-weight="700" font-size="20" fill="#f97316">أسطول صهاريج نقل بترولية مجهز بأحدث أنظمة التتبع GPS والعدادات الإلكترونية</text>
      <text x="0" y="165" font-family="'Cairo', sans-serif" font-weight="500" font-size="16" fill="#9ca3af">نلبي احتياجات الموانئ، محطات الخرسانة، مصانع الغزل والنسيج، وشركات المقاولات الكبرى على مدار 24 ساعة.</text>
    </g>

    <!-- Operational Metrics Cards -->
    <g transform="translate(45, 250)">
      <rect width="250" height="150" rx="14" fill="#151a2a" stroke="#2a334d" stroke-width="1" />
      <text x="25" y="45" font-family="'Cairo', sans-serif" font-weight="700" font-size="15" fill="#f97316">حجم التوريد الشهري</text>
      <text x="25" y="95" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#ffffff">15M+ L</text>
      <text x="25" y="125" font-family="'Cairo', sans-serif" font-weight="600" font-size="12" fill="#22c55e">سولار وديزل مطابق للمواصفات</text>

      <g transform="translate(280, 0)">
        <rect width="250" height="150" rx="14" fill="#151a2a" stroke="#2a334d" stroke-width="1" />
        <text x="25" y="45" font-family="'Cairo', sans-serif" font-weight="700" font-size="15" fill="#f97316">أسطول الصهاريج النشط</text>
        <text x="25" y="95" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#ffffff">65+ Trucks</text>
        <text x="25" y="125" font-family="'Cairo', sans-serif" font-weight="600" font-size="12" fill="#38bdf8">حمولة من 10 إلى 50 طن</text>
      </g>

      <g transform="translate(560, 0)">
        <rect width="250" height="150" rx="14" fill="#151a2a" stroke="#2a334d" stroke-width="1" />
        <text x="25" y="45" font-family="'Cairo', sans-serif" font-weight="700" font-size="15" fill="#f97316">سرعة التلبية الطارئة</text>
        <text x="25" y="95" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#ffffff">&lt; 4 Hours</text>
        <text x="25" y="125" font-family="'Cairo', sans-serif" font-weight="600" font-size="12" fill="#fbbf24">استجابة لخطوط الإنتاج الحرجة</text>
      </g>
    </g>

    <!-- Fleet Telemetry Dispatch Banner -->
    <g transform="translate(45, 450)">
      <rect width="810" height="180" rx="14" fill="#131726" stroke="#f97316" stroke-width="1" />
      <text x="35" y="45" font-family="'Inter', sans-serif" font-weight="800" font-size="17" fill="#f97316">LIVE FLEET TELEMETRY &amp; FUEL FLOW METERING</text>
      <text x="35" y="80" font-family="'Cairo', sans-serif" font-weight="700" font-size="19" fill="#ffffff">بوابة تتبع الشحنات اللحظية لعملاء الشركات</text>
      <text x="35" y="115" font-family="'Cairo', sans-serif" font-weight="500" font-size="15" fill="#cbd5e1">يمكن لمسؤولي المشتريات مراقبة مسار الناقلة، قراءات العداد الإلكتروني المعاير، ووقت الوصول المتوقع لصهريج الوقود بالمصنع لحظة بلحظة.</text>
    </g>
  </g>

  <!-- Right Column: Industrial Fuel Supply Quotation Calculator -->
  <g transform="translate(1020, 160)">
    <rect width="500" height="680" rx="20" fill="#111420" stroke="#22283a" stroke-width="1.5" />
    
    <g transform="translate(45, 45)">
      <text x="0" y="30" font-family="'Cairo', sans-serif" font-weight="800" font-size="24" fill="#ffffff">حاسبة توريد الوقود والتعاقدات</text>
      <text x="0" y="60" font-family="'Cairo', sans-serif" font-weight="500" font-size="14" fill="#f97316">احصل على عرض سعر فوري لشركتك أو مصنعك</text>

      <!-- Calculator Form -->
      <g transform="translate(0, 90)">
        <rect width="410" height="65" rx="10" fill="#161b2c" stroke="#28324a" stroke-width="1" />
        <text x="20" y="27" font-family="'Cairo', sans-serif" font-weight="600" font-size="12" fill="#9ca3af">نوع المنشأة / النشاط الصناعي:</text>
        <text x="20" y="50" font-family="'Cairo', sans-serif" font-weight="700" font-size="16" fill="#ffffff">مصنع إنتاج / محطة خرسانة جاهزة</text>

        <rect y="85" width="410" height="65" rx="10" fill="#161b2c" stroke="#28324a" stroke-width="1" />
        <text x="20" y="112" font-family="'Cairo', sans-serif" font-weight="600" font-size="12" fill="#9ca3af">الكمية الشهرية المقدرة (باللتر):</text>
        <text x="20" y="135" font-family="'Inter', sans-serif" font-weight="800" font-size="17" fill="#f97316">50,000 Liters / Month</text>

        <rect y="170" width="410" height="65" rx="10" fill="#161b2c" stroke="#28324a" stroke-width="1" />
        <text x="20" y="197" font-family="'Cairo', sans-serif" font-weight="600" font-size="12" fill="#9ca3af">موقع التسليم والتفريغ:</text>
        <text x="20" y="220" font-family="'Cairo', sans-serif" font-weight="700" font-size="15" fill="#ffffff">المنطقة الصناعية - العاشر من رمضان</text>

        <rect y="255" width="410" height="52" rx="10" fill="url(#fuel-flame)" />
        <text x="120" y="287" font-family="'Cairo', sans-serif" font-weight="900" font-size="16" fill="#ffffff">إصدار عرض السعر الفوري</text>
      </g>

      <!-- Safety Commitments -->
      <g transform="translate(0, 440)">
        <rect width="410" height="150" rx="12" fill="#0d101a" stroke="#1d2335" stroke-width="1" />
        <text x="25" y="35" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#ffffff">معايير السلامة والجودة المضمونة:</text>
        <text x="25" y="65" font-family="'Cairo', sans-serif" font-weight="500" font-size="13" fill="#f97316">✓ مطابقة كاملة لكثافة ولزوجة السولار ونسب الكبريت</text>
        <text x="25" y="95" font-family="'Cairo', sans-serif" font-weight="500" font-size="13" fill="#f97316">✓ طواقم قيادة معتمدة وحاصلة على دورات المواد الخطرة</text>
        <text x="25" y="125" font-family="'Cairo', sans-serif" font-weight="500" font-size="13" fill="#f97316">✓ فواتير ضريبية إلكترونية معتمدة من مصلحة الضرائب</text>
      </g>
    </g>
  </g>
</svg>
